<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETG Sim — {{ game_name }}</title>
<style>
:root{--bg:#0b0f14;--panel:#111820;--felt:#07522b;--felt2:#063d21;--gold:#d4af37;--gold2:#f4e5a3;--text:#edf1f5;--muted:#91a0ad;--line:#d9b74d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif}header{height:64px;background:#081016;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;border-bottom:1px solid #25313b}.back{color:var(--muted);text-decoration:none;font-size:12px}.title{font-size:18px;font-weight:800;color:var(--gold2)}.bal{text-align:right}.bal small{display:block;color:var(--muted)}.bal b{font-size:23px;color:var(--gold2)}main{display:flex;min-height:calc(100vh - 64px)}.left{flex:1;min-width:0;padding:16px}.right{width:360px;flex:0 0 360px;background:var(--panel);padding:18px;border-left:1px solid #26323c}.status{background:#151d25;border:1px solid #35424e;border-radius:10px;padding:11px 14px;margin-bottom:12px}.felt{background:radial-gradient(circle at 50% 0,#0d713b,var(--felt) 48%,var(--felt2));border:3px solid #806b2c;border-radius:18px;padding:14px;min-height:620px;box-shadow:inset 0 0 45px #0005}
.dealer-zone{text-align:center;min-height:205px;border-bottom:1px solid #ffffff24;padding:5px 0 12px}.zone-title,.community-title{font-weight:900;color:var(--gold2);letter-spacing:.08em;font-size:12px}.community-title{margin-top:10px;color:#b7c4ce}.dealer-cards,.community-cards,.hand-cards{display:flex;justify-content:center;gap:8px;margin-top:7px}.card-slot,.card{width:52px;height:74px;border-radius:5px}.card-slot{border:1px solid #ffffff55;background:#0002}.card{background:#fffaf0;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 3px 8px #0008}.card.red{color:#c33}.card.down{background:repeating-linear-gradient(45deg,#163b62,#163b62 4px,#0d2947 4px,#0d2947 8px);border:2px solid #d7e0e7}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.seat{min-width:0;padding:8px;border-right:1px solid #ffffff20;text-align:center}.seat:last-child{border-right:0}.seat-title{display:inline-block;padding:5px 16px;border:1px solid #d4af3777;border-radius:8px;background:#0b3420;font-weight:900}.seat.active .seat-title{border-color:var(--gold);box-shadow:0 0 12px #d4af3755}.hand-cards{min-height:80px}
.bet-layout{min-height:235px;display:flex;flex-direction:column;justify-content:flex-end;gap:13px}.side-row{height:90px;display:flex;justify-content:center;align-items:center;gap:18px}.main-row{display:grid;gap:0;justify-content:center}.main-row.cols-1{grid-template-columns:150px}.main-row.cols-2{grid-template-columns:repeat(2,130px)}.main-row.cols-3{grid-template-columns:repeat(3,105px)}.wager{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-weight:850;font-size:11px;user-select:none;transition:.12s;background:#073a22}.wager:hover:not(.locked){background:#ffffff12}.wager.circle{width:78px;height:78px;border:2px solid var(--line);border-radius:50%}.wager.rect{height:72px;border:2px solid var(--line);border-radius:0}.main-row .wager+.wager{border-left:0}.wager.locked{opacity:.45;cursor:default}.wager .amt{position:absolute;bottom:3px;font-size:9px;color:var(--gold2)}
.actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:7px}.action{border:0;border-radius:7px;padding:7px 10px;font-weight:800;cursor:pointer}.action.primary{background:var(--gold);color:#241b06}.action.secondary{background:#2c3945;color:white}.slip{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.35}.clear{background:#303943;color:white}.deal{background:var(--gold);color:#2a2008}
.chip-panel{background:#061b11;border:1px solid #20472e;border-radius:14px;padding:18px}.lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}.chipbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.chip{aspect-ratio:1;border-radius:50%;border:4px dashed #ffffff35;cursor:pointer;font-weight:900;font-size:12px;box-shadow:inset 0 0 0 5px #0003,0 3px 8px #0008}.chip.active{outline:3px solid #f0d25a;outline-offset:2px;filter:brightness(1.25)}.chip-stack{position:absolute;z-index:5;right:4px;top:4px;width:30px;height:30px;border-radius:50%;border:3px dashed #ffffff55;display:flex;align-items:center;justify-content:center;font-size:9px;color:white;text-shadow:0 1px 2px #000}.reset{width:100%;margin:14px 0;background:#58232b;color:#ffb0b0}.note,.pay{font-size:11px;line-height:1.45}.note{color:#efd681}.pay{margin-top:14px}.pay-row{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff0d;padding:3px 0}.pay-row span:last-child{color:var(--gold2)}.history-title{font-size:10px;color:var(--muted);margin-top:16px;letter-spacing:.08em}.history{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.hist{border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:10px}.hist.win{color:#4ade80}.hist.loss{color:#f87171}.hist.push{color:#aab4bf}
@media(max-width:1050px){main{display:block}.right{width:auto}.seats{grid-template-columns:1fr}.seat{border-right:0;border-bottom:1px solid #ffffff20}.felt{min-height:0}}
</style></head><body>
<header><div><a class="back" href="{{ url_for('portal') }}">← Portal</a><div class="title">{{ game_icon }} {{ game_name }}</div></div><div class="bal"><small>Credits</small><b id="balance">{{ starting_credits }}</b></div></header>
<main><section class="left"><div id="status" class="status">Place your initial wagers. Seat 1 is viewed; Seats 2–3 follow MBS Blind Betting / House Way.</div>
<div class="felt"><div class="dealer-zone"><div id="dealerTitle" class="zone-title">DEALER</div><div id="dealerCards" class="dealer-cards"></div><div id="communityTitle" class="community-title"></div><div id="community" class="community-cards"></div></div><div id="seats" class="seats"></div></div>
<div class="slip"><span>On table: <b id="pending">0</b> cr</span><div><button id="clear" class="btn clear">Clear All</button> <button id="deal" class="btn deal">Deal</button></div></div></section>
<aside class="right"><div class="chip-panel"><div class="lbl">Chip value</div><div id="chipBar" class="chipbar"></div></div><button id="reset" class="btn reset">↺ Reset Credits</button><div id="rulesNote" class="note"></div><div id="pay" class="pay"></div><div class="history-title">HISTORY</div><div id="history" class="history"></div></aside></main>
<script>window.POKER_GAME={{ game|tojson }};window.POKER_MAX={{ max_bet|tojson }};window.POKER_START={{ starting_credits|tojson }};</script><script src="{{ url_for('static',filename='js/poker_solo.js') }}"></script></body></html>
