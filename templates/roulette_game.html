<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>{{ game_name }} · ETG Sim</title>

<style>
:root{
  --bg:#04110c;
  --panel:#071a13;
  --felt:#064d2c;
  --felt2:#08703d;
  --gold:#d5a72c;
  --gold2:#f4dc83;
  --text:#f7f4e7;
  --muted:#a8b9aa;
  --red:#a52b27;
  --green:#08713c;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0,#0b4329,#020b08 70%);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}

button{
  font:inherit;
}

/* ============================================================
   SHELL / HEADER
   ============================================================ */

.shell{
  min-height:100vh;
  padding:14px;
}

.top{
  display:grid;
  grid-template-columns:150px 1fr 590px;
  gap:16px;
  align-items:start;
}

.portal,
.reset{
  border:1px solid #a27d24;
  border-radius:10px;
  padding:13px;
  background:#06150f;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

.game-title{
  font-size:34px;
  color:var(--gold2);
  font-weight:900;
  letter-spacing:.04em;
}

.ready{
  font-size:12px;
  border:1px solid #967821;
  border-radius:999px;
  padding:7px 14px;
  margin-left:12px;
}

.balance{
  text-align:center;
  color:var(--gold2);
  font-size:14px;
}

.balance strong{
  display:block;
  font-size:28px;
}

/* ============================================================
   CHIPS
   ============================================================ */

.chipbar{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:8px;
}

.chip{
  width:58px;
  height:58px;
  border-radius:50%;
  border:3px dashed #eee;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.chip.active{
  outline:3px solid var(--gold);
}

/* ============================================================
   MAIN
   ============================================================ */

.main{
  display:grid;
  grid-template-columns:150px minmax(980px,1fr);
  gap:12px;
  margin-top:12px;
}

.side{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.panel{
  background:#06150fdd;
  border:1px solid #7d6520;
  border-radius:10px;
  padding:12px;
}

.metric{
  padding:10px 0;
  border-bottom:1px solid #ffffff15;
}

.metric:last-child{
  border:0;
}

.metric small{
  display:block;
  color:#ddd;
}

.metric strong{
  font-size:20px;
}

.net{
  color:#65ef8a;
}

.history{
  min-height:250px;
  font-family:system-ui,sans-serif;
  font-size:12px;
  color:#b7c4ba;
}

.center{
  min-width:0;
}

/* ============================================================
   ROULETTE WHEEL STAGE
   ============================================================ */

.wheel-stage{
  position:relative;
  min-height:390px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:-40px;
  z-index:3;
  pointer-events:none;
}

.roulette-wheel-shell{
  --wheel-size:350px;

  position:relative;
  width:var(--wheel-size);
  height:var(--wheel-size);
  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 45%,
      #9b671d 0%,
      #5e370c 34%,
      #241505 63%,
      #080604 100%
    );

  border:8px solid #b88a2d;

  box-shadow:
    0 22px 45px #000c,
    inset 0 0 18px #f2d27444,
    inset 0 0 45px #000;
}

.roulette-wheel-shell::before{
  content:"";

  position:absolute;
  inset:13px;

  border-radius:50%;

  border:3px solid #d2b35d;

  box-shadow:
    inset 0 0 12px #000,
    0 0 8px #0008;
}

/* ============================================================
   BALL TRACK
   ============================================================ */

.roulette-ball-rail{
  position:absolute;

  left:50%;
  top:50%;

  width:316px;
  height:316px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  border:
    11px solid
    rgba(35,20,5,.75);

  box-shadow:
    inset 0 0 5px #e4c16688,
    0 0 6px #000;
}

/* ============================================================
   ROTOR
   ============================================================ */

.roulette-rotor{
  position:absolute;

  left:50%;
  top:50%;

  width:278px;
  height:278px;

  transform:
    translate(-50%,-50%)
    rotate(0deg);

  transform-origin:center;

  border-radius:50%;

  will-change:transform;
}

.roulette-pocket{
  position:absolute;

  left:50%;
  top:50%;

  width:34px;
  height:55px;

  margin-left:-17px;
  margin-top:-27.5px;

  transform-origin:
    17px
    27.5px;

  clip-path:
    polygon(
      23% 0,
      77% 0,
      100% 100%,
      0 100%
    );

  display:flex;

  align-items:flex-start;
  justify-content:center;

  padding-top:5px;

  border-top:
    1px solid
    #e5d69a;

  color:#fff;

  font-family:
    Arial,
    sans-serif;

  font-size:10px;

  font-weight:900;

  text-shadow:
    0 1px 2px
    #000;

  box-shadow:
    inset 0 0 4px
    #0008;
}

.roulette-pocket.red{
  background:
    linear-gradient(
      #b22d2d,
      #681313
    );
}

.roulette-pocket.black{
  background:
    linear-gradient(
      #313131,
      #080808
    );
}

.roulette-pocket.green{
  background:
    linear-gradient(
      #0a8a4c,
      #034527
    );
}

.roulette-pocket.winning-pocket{
  filter:
    brightness(1.8);

  box-shadow:
    inset 0 0 8px #fff,
    0 0 13px #ffe77d;
}

/* ============================================================
   ROTOR INNER RING
   ============================================================ */

.roulette-inner-bowl{
  position:absolute;

  left:50%;
  top:50%;

  width:175px;
  height:175px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #e4c36d,
      #a66e18 33%,
      #4b2c08 69%,
      #160d03
    );

  border:
    4px solid
    #d7b252;

  box-shadow:
    inset 0 0 18px #0008,
    0 3px 9px #0009;

  z-index:3;
}

.roulette-inner-bowl::before{
  content:"";

  position:absolute;

  inset:23px;

  border-radius:50%;

  border:
    2px solid
    #5b3508;

  box-shadow:
    inset 0 0 14px #0009;
}

/* ============================================================
   SPINDLE
   ============================================================ */

.roulette-spindle{
  position:absolute;

  left:50%;
  top:50%;

  width:58px;
  height:58px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  z-index:8;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 35% 28%,
      #fff2ad,
      #c68c1e 58%,
      #573504
    );

  color:#271700;

  border:
    3px solid
    #4b2d04;

  font-size:17px;

  font-weight:900;

  box-shadow:
    0 5px 12px #000a;
}

.roulette-spindle::before,
.roulette-spindle::after{
  content:"";

  position:absolute;

  width:126px;
  height:6px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #5e3d09,
      #f1d47c,
      #5e3d09
    );

  z-index:-1;
}

.roulette-spindle::after{
  transform:rotate(90deg);
}

/* ============================================================
   BALL
   ============================================================ */

.roulette-ball-orbit{
  position:absolute;

  left:50%;
  top:50%;

  width:316px;
  height:316px;

  transform:
    translate(-50%,-50%)
    rotate(0deg);

  transform-origin:center;

  border-radius:50%;

  z-index:10;

  will-change:transform,width,height;
}

.roulette-ball{
  position:absolute;

  left:50%;
  top:-2px;

  width:15px;
  height:15px;

  margin-left:-7.5px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 28%,
      #fff,
      #f2f2f2 40%,
      #bcbcbc 75%,
      #666
    );

  border:
    1px solid
    #777;

  box-shadow:
    0 2px 5px #000,
    0 0 4px #fff7;
}

/* ============================================================
   POINTER
   ============================================================ */

.roulette-pointer{
  position:absolute;

  left:50%;
  top:-13px;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    14px solid
    transparent;

  border-right:
    14px solid
    transparent;

  border-top:
    31px solid
    #f0d369;

  filter:
    drop-shadow(
      0 3px 2px
      #000
    );

  z-index:20;
}

/* ============================================================
   RESULT BOX
   ============================================================ */

.result-pocket{
  position:absolute;

  left:
    calc(
      50% + 215px
    );

  top:125px;

  min-width:135px;

  padding:
    12px 18px;

  border-radius:12px;

  border:
    2px solid
    #d1aa45;

  background:
    #06150ff0;

  text-align:center;

  box-shadow:
    0 8px 20px
    #0008;
}

.result-pocket small{
  display:block;

  color:#cabd8c;

  font-family:
    system-ui,
    sans-serif;

  font-size:10px;
}

.result-pocket strong{
  display:block;

  margin-top:3px;

  font-size:31px;
}

.result-pocket.red strong{
  color:#ff8b82;
}

.result-pocket.black strong{
  color:#eee;
}

.result-pocket.green strong{
  color:#68ef9e;
}

/* ============================================================
   BOARD WRAPPER
   ============================================================ */

.board-wrap{
  background:#043f25;

  border:
    3px solid
    #a98427;

  border-radius:22px;

  padding:
    48px 12px
    12px;

  box-shadow:
    0 14px 30px
    #0008;

  overflow:auto;
}

.board{
  min-width:1120px;
}

/* ============================================================
   NUMBER BOARD
   ============================================================ */

.roulette-inside{
  display:grid;

  grid-template-columns:
    126px
    minmax(
      900px,
      1fr
    );

  gap:4px;
}

.zero-area{
  display:grid;

  gap:3px;
}

.zero-area.single{
  grid-template-rows:1fr;
}

.zero-area.double{
  grid-template-rows:
    repeat(2,1fr);
}

.zero-area.sands{
  grid-template-rows:
    repeat(3,1fr);
}

.roulette-number-grid{
  position:relative;

  display:grid;

  grid-template-columns:
    repeat(12,1fr);

  grid-template-rows:
    repeat(3,74px);

  gap:0;

  border-top:
    1px solid
    #d2b35e;

  border-left:
    1px solid
    #d2b35e;
}

.roulette-number,
.roulette-zero{
  position:relative;

  display:flex;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  color:#fff;

  font-size:22px;

  font-weight:900;

  user-select:none;

  border-right:
    1px solid
    #d2b35e;

  border-bottom:
    1px solid
    #d2b35e;

  transition:
    filter .08s,
    box-shadow .08s;
}

.roulette-zero{
  border:
    1px solid
    #d2b35e;

  border-radius:5px;

  background:
    linear-gradient(
      145deg,
      #0b7a45,
      #034326
    );
}

.roulette-number.red{
  background:
    linear-gradient(
      145deg,
      #a32828,
      #711717
    );
}

.roulette-number.black{
  background:
    linear-gradient(
      145deg,
      #282828,
      #090909
    );
}

.roulette-number:hover,
.roulette-zero:hover{
  filter:
    brightness(1.25);
}

.roulette-number.covered,
.roulette-zero.covered{
  filter:
    brightness(1.55);

  box-shadow:
    inset 0 0 0 3px
    #ffe97c;

  z-index:5;
}

.roulette-number.winner,
.roulette-zero.winner{
  animation:
    roulette-winning-cell
    .42s
    ease-in-out
    5;
}

@keyframes roulette-winning-cell{
  0%,100%{
    filter:brightness(1);
  }

  50%{
    filter:brightness(1.9);

    box-shadow:
      inset 0 0 0 3px #fff5b0,
      0 0 20px #ffe777;
  }
}

/* ============================================================
   INSIDE BET HOTSPOTS
   ============================================================ */

.roulette-hotspot{
  position:absolute;

  z-index:12;

  cursor:pointer;

  border-radius:50%;

  background:
    transparent;
}

.roulette-hotspot:hover{
  background:
    rgba(
      255,
      225,
      92,
      .38
    );

  box-shadow:
    0 0 8px
    #ffe66d;
}

.roulette-hotspot.split-horizontal{
  width:28px;
  height:42px;

  transform:
    translate(
      -50%,
      -50%
    );
}

.roulette-hotspot.split-vertical{
  width:42px;
  height:28px;

  transform:
    translate(
      -50%,
      -50%
    );
}

.roulette-hotspot.corner{
  width:30px;
  height:30px;

  transform:
    translate(
      -50%,
      -50%
    );
}

.roulette-hotspot.street{
  width:26px;
  height:48px;

  transform:
    translate(
      -50%,
      -50%
    );
}

.roulette-hotspot.sixline{
  width:30px;
  height:48px;

  transform:
    translate(
      -50%,
      -50%
    );
}

.hotspot-badge,
.bet-badge{
  position:absolute;

  right:3px;
  top:3px;

  background:#d4af37;

  color:#111;

  border-radius:99px;

  padding:2px 5px;

  font-family:
    system-ui,
    sans-serif;

  font-size:9px;

  font-weight:900;

  pointer-events:none;
}

.roulette-hotspot .hotspot-badge{
  right:auto;
  top:50%;
  left:50%;

  transform:
    translate(
      -50%,
      -50%
    );

  white-space:nowrap;
}

/* ============================================================
   ZERO SPECIAL INSIDE BETS
   ============================================================ */

.zero-specials{
  margin-top:4px;

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(115px,1fr)
    );

  gap:3px;
}

.zero-specials .bet{
  min-height:48px;
}

/* ============================================================
   STANDARD BET CELLS
   ============================================================ */

.bet{
  position:relative;

  min-height:58px;

  border:
    1px solid
    #a78628;

  border-radius:6px;

  padding:5px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  cursor:pointer;

  background:#06492b;

  color:#fff;

  user-select:none;
}

.bet:hover{
  background:#0a6539;
}

.bet strong{
  font-size:15px;
}

.bet small{
  margin-top:3px;

  color:#eadc8a;

  font-size:10px;
}

.bet.red-bet{
  background:#8e2525;
}

.bet.black-bet{
  background:#171717;
}

/* ============================================================
   OUTSIDE BETS
   ============================================================ */

.roulette-columns{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:3px;

  margin-top:4px;
}

.roulette-dozens{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:3px;

  margin-top:4px;
}

.roulette-outside{
  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:3px;

  margin-top:4px;
}

.roulette-special{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:3px;

  margin-top:4px;
}

/* ============================================================
   ACTION BAR
   ============================================================ */

.actionbar{
  display:grid;

  grid-template-columns:
    1fr
    190px
    310px;

  gap:8px;

  background:#07140f;

  padding:10px;

  border-radius:
    0 0 16px 16px;

  border:
    1px solid
    #755e1d;
}

.actionbar button{
  padding:14px;

  border-radius:8px;

  border:
    1px solid
    #777;

  font-weight:900;
}

.clear{
  background:#181b1b;
  color:#ddd;
}

.spin{
  background:
    linear-gradient(
      #e4b53d,
      #a9750b
    );

  color:#fff;

  font-size:18px;
}

/* ============================================================
   RULES
   ============================================================ */

.rules{
  margin-top:8px;

  border:
    1px solid
    #a37c20;

  border-radius:10px;

  padding:12px;

  background:#06351f;
}

.rules h3{
  text-align:center;

  color:var(--gold2);

  margin:
    0 0 8px;
}

.rules-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

  font-family:
    system-ui,
    sans-serif;

  font-size:12px;
}

@media(max-width:1100px){
  .top{
    grid-template-columns:
      120px 1fr;
  }

  .top-right{
    grid-column:
      1/-1;
  }

  .main{
    grid-template-columns:
      120px 1fr;
  }

  .chipbar{
    justify-content:center;
  }

  .rules-grid{
    grid-template-columns:
      1fr 1fr;
  }
}

</style>
</head>

<body>

<div class="shell">

<div class="top">

  <a
    class="portal"
    href="{{ url_for('portal') }}"
  >
    ← PORTAL
  </a>

  <div>
    <span class="game-title">
      🎡 {{ game_name|upper }}
    </span>

    <span
      class="ready"
      id="phaseLabel"
    >
      READY
    </span>
  </div>

  <div class="top-right">

    <div class="balance">
      BALANCE

      <strong id="balanceDisplay">
        0
      </strong>
    </div>

    <div
      class="chipbar"
      id="chipBar"
    ></div>

  </div>

</div>


<div class="main">

<aside class="side">

  <div class="panel">

    <div class="metric">
      <small>LAST RESULT</small>

      <strong id="lastResult">
        —
      </strong>
    </div>

    <div class="metric">
      <small>TOTAL STAKE</small>

      <strong id="stakeMetric">
        0
      </strong>
    </div>

    <div class="metric">
      <small>TOTAL RETURN</small>

      <strong id="returnMetric">
        0
      </strong>
    </div>

    <div class="metric">
      <small>NET WIN</small>

      <strong
        class="net"
        id="netMetric"
      >
        0
      </strong>
    </div>

  </div>


  <div class="panel history">

    <b>SPIN HISTORY</b>

    <div id="history">
      No spins yet
    </div>

  </div>

</aside>


<section class="center">

  <!-- ========================================================
       WHEEL
       ======================================================== -->

  <div class="wheel-stage">

    <div
      class="roulette-wheel-shell"
      id="wheelShell"
    >

      <div class="roulette-pointer"></div>

      <div class="roulette-ball-rail"></div>

      <div
        class="roulette-rotor"
        id="rouletteRotor"
      ></div>

      <div class="roulette-inner-bowl"></div>

      <div class="roulette-spindle">
        ETG
      </div>

      <div
        class="roulette-ball-orbit"
        id="rouletteBallOrbit"
      >
        <div class="roulette-ball"></div>
      </div>

    </div>


    <div
      class="result-pocket green"
      id="resultPocket"
    >

      <small>
        WINNING NUMBER
      </small>

      <strong id="resultNumber">
        —
      </strong>

    </div>

  </div>


  <!-- ========================================================
       BOARD
       ======================================================== -->

  <div class="board-wrap">

    <div
      class="board"
      id="bettingArea"
    ></div>

  </div>


  <!-- ========================================================
       ACTION BAR
       ======================================================== -->

  <div class="actionbar">

    <div>
      ON TABLE
      <br>

      <strong id="pendingTotal">
        0
      </strong>
    </div>

    <button
      class="clear"
      id="clearBtn"
    >
      ✕ CLEAR BETS
    </button>

    <button
      class="spin"
      id="spinBtn"
      disabled
    >
      🎡 SPIN
    </button>

  </div>


  <!-- ========================================================
       RULES
       ======================================================== -->

  <div class="rules">

    <h3 id="rulesTitle">
      ROULETTE RULES
    </h3>

    <div
      class="rules-grid"
      id="rulesBox"
    ></div>

  </div>

</section>

</div>


<button
  class="reset"
  id="resetBtn"
  style="
    position:fixed;
    right:14px;
    top:14px
  "
>
  ↻ RESET CREDITS
</button>

</div>


<script>
window.ROULETTE_GAME =
  {{ game|tojson }};

window.ROULETTE_MAX =
  {{ max_bet|tojson }};

window.ROULETTE_START =
  {{ starting_credits|tojson }};
</script>


<script
  src="{{ url_for(
    'static',
    filename='js/roulette_solo.js'
  ) }}?v={{ static_v }}"
></script>

</body>
</html>
